# Routing configuration — single source of truth for classification, keywords and agent mapping.

classifications:
  - id: funds-forex
    label: 资金合规 — 外汇管理
    keywords: [SAFE, 外汇管理局, 结售汇, 经常项目, 资本项目, 跨境收支]
    agent: funds-compliance-analyst

  - id: funds-banking
    label: 资金合规 — 银行合规/AML/制裁
    keywords: [AML, KYC, 反洗钱, 制裁, sanctions, OFAC, 支付牌照]
    agent: funds-compliance-analyst

  - id: tax
    label: 税务政策与办税服务
    keywords: [税收政策, 办税服务, 纳税咨询, 征收管理, 个人所得税, 增值税, 发票, 纳税信用, 优惠政策, 答复草拟, 税费计算, 预提税, 利得税, 企业所得税, GST, VAT, 税收协定, 股息, 利息, 特许权使用费, 服务费, 资本利得]
    agent: tax-policy-analyst

  - id: commercial
    label: 民商法规
    keywords: [公司设立, 董事, 股东, 股权转让, 合同, 商业登记, 牌照, 投资准入, 证券监管, 境外发行, 境外上市, 上市备案, 中国证监会, CSRC]
    agent: commercial-law-analyst

cross_domain_rules:
  - condition: "tax and funds both present, core is payment characterization"
    primary: tax
    secondary: funds

subdomains:
  tax:
    - id: policy-query
      label: 税收政策查询与适用条件
      keywords: [税收政策, 优惠政策, 适用条件, 有效期, 政策依据]
    - id: service-materials
      label: 办税材料与征管服务
      keywords: [办税材料, 申报, 缴纳, 发票, 征收管理, 纳税信用]
    - id: reply-drafting
      label: 咨询答复与工作文稿草拟
      keywords: [纳税咨询, 答复草拟, 通知草稿, 工作文稿, 材料解读]
    - id: tax-calculation
      label: 税费计算与参数核对
      keywords: [税额, 税率, 税基, 计算, 抵扣, 扣除]
  funds:
    - id: forex-administration
      label: 外汇管理
      keywords: [SAFE, 外汇管理局, 结售汇, 经常项目, 资本项目]
    - id: aml-kyc
      label: 反洗钱/客户尽职调查
      keywords: [AML, KYC, 反洗钱, 客户尽职调查]
    - id: sanctions
      label: 制裁
      keywords: [OFAC, 制裁, sanctions, SDN]
    - id: payment-licensing
      label: 支付牌照
      keywords: [支付牌照, 支付服务]
  commercial:
    - id: securities-regulation
      label: 证券监管／境外发行上市备案
      keywords: [证券监管, 境外发行, 境外上市, 上市备案, 间接境外发行上市, 存量企业, 中国证监会, CSRC]
