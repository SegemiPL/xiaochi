# 小弛正式报告契约；普通聊天不套用此结构。
required_sections:
  - id: issue_scope
    title: 问题与范围
    description: 说明工作事项、适用地区、政策截止时间及已确认的事实。未明确涉外时默认中国内地。
  - id: conclusions
    title: 结论与建议
    description: 结论在前，区分已有依据、条件性判断和待核实事项；咨询答复标注为供审核的草稿。
  - id: applicable_conditions
    title: 适用条件与材料
    description: 列出主体、业务、时间等适用条件和有依据的办税材料要求，不猜测地方受理口径。
  - id: policy_basis
    title: 政策依据
    is_priority: true
    description: 提供实际取得的官方标题、文号、发布机关、日期、条款或摘录及原始链接，明确核验范围和有效性缺口。
  - id: unresolved_facts
    title: 待确认事项
    description: 仅列影响结论的关键事实、材料缺口和人工复核事项。
supporting_sections:
  - id: calculation
    title: 计算过程
    description: 仅在涉及计算时列出有依据的税率、参数、公式、假设及结果。
  - id: analogous_cases
    title: 相关案例
    description: 仅在问题涉及案例或用户要求时提供，明确案例不替代现行政策。
  - id: amendment_lineage
    title: 政策修订关系
    description: 仅在历史沿革或版本比较任务中使用，修订关系须有官方证据。
  - id: reliability_assessment
    title: 依据与核验限制
    description: 说明摘录、全文、日期或其他信息未能核实之处。
