[project]
name = "xiaochi-agent"
version = "0.1.0"
description = "Government tax assistance agent based on the 3wagent core."
requires-python = ">=3.11"
dependencies = [
    "qwen-agent[python-executor]>=0.0.34",
    "json5>=0.9.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.18",
    "numpy>=1.24.0",
    "socksio>=1.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "markdown-it-py[linkify]>=3.0",
    "pypdf>=4.0",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "pytest>=8.0",
]
# Heavy PDF parsing (scans, multi-column, formulas) runs out-of-process:
# deploy MinerU as a separate CLI/HTTP service instead of installing it here.
legacy-excel = [
    "xlrd>=2.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
